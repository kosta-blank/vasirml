name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18.20.0", "20.10.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Generated Agent Templates
        run: npm run check:agents

      - name: Check Generated Registry
        run: npm run check:registry

      - name: Check Public Review Projections
        run: npm run check:review

      - name: Run Test Suite
        run: npm test

      - name: Validate Package Contents
        run: npm pack --dry-run

      - name: Verify Installed Archive
        shell: bash
        run: |
          archive=$(npm pack --silent)
          npm run check:package -- "$archive"
