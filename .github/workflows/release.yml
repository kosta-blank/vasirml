name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Agent Templates
        run: npm run build:agents

      - name: Build Registry
        run: npm run build:registry

      - name: Check Public Review Projections
        run: npm run check:review

      - name: Check Generated Agent Templates
        run: npm run check:agents

      - name: Check Generated Registry
        run: npm run check:registry

      - name: Run Test Suite
        run: npm test

      - name: Validate Package Contents
        run: npm pack --dry-run

      - name: Pack Private Archive
        run: |
          archive=$(npm pack --silent)
          npm run check:package -- "$archive"

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: vasir-slim-${{ github.ref_name }}
          path: vasir-slim-*.tgz
          if-no-files-found: error
